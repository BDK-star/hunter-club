name: hunter-club

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: hunter_club
      POSTGRES_PASSWORD: hunter_club
      POSTGRES_USER: hunter_club
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter_club -d hunter_club"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - hunter-club-postgres:/var/lib/postgresql/data

volumes:
  hunter-club-postgres:
